version: '3.8'

services:
  # ============================================
  # Chat application with automatic database initialization
  # On startup: Runs database deployment (deploy), then starts chat
  # ============================================
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: azure-sql-chat-app
    stdin_open: true  # Enable interactive mode
    tty: true         # Allocate pseudo-TTY for interactive chat
    environment:
      # Azure OpenAI configuration
      OPENAI_URL: "${OPENAI_URL}"
      OPENAI_KEY: "${OPENAI_KEY}"
      OPENAI_EMBEDDING_DEPLOYMENT_NAME: "${OPENAI_EMBEDDING_DEPLOYMENT_NAME:-text-embedding-3-small}"
      OPENAI_CHAT_DEPLOYMENT_NAME: "${OPENAI_CHAT_DEPLOYMENT_NAME:-gpt-4}"

      # External SQL Database configuration (Azure SQL Database)
      MSSQL_CONNECTION_STRING: "${MSSQL_CONNECTION_STRING}"
      MSSQL_TABLE_NAME: "${MSSQL_TABLE_NAME:-ChatMemories}"
    # Optionally use env_file instead of environment variables above
    # env_file:
    #   - .env

  # ============================================
  # Chat application with debug mode
  # Use: docker-compose --profile debug up chatbot-debug
  # ============================================
  chatbot-debug:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: azure-sql-chat-app-debug
    command: chat --debug  # Override default CMD
    stdin_open: true
    tty: true
    environment:
      OPENAI_URL: "${OPENAI_URL}"
      OPENAI_KEY: "${OPENAI_KEY}"
      OPENAI_EMBEDDING_DEPLOYMENT_NAME: "${OPENAI_EMBEDDING_DEPLOYMENT_NAME:-text-embedding-3-small}"
      OPENAI_CHAT_DEPLOYMENT_NAME: "${OPENAI_CHAT_DEPLOYMENT_NAME:-gpt-4}"
      MSSQL_CONNECTION_STRING: "${MSSQL_CONNECTION_STRING}"
      MSSQL_TABLE_NAME: "${MSSQL_TABLE_NAME:-ChatMemories}"
    profiles:
      - debug
