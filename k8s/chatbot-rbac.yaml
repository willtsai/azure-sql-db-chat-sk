apiVersion: v1
kind: ServiceAccount
metadata:
  name: chatbot-sa
  namespace: default-insurance-chat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dapr-component-manager
  namespace: default-insurance-chat
rules:
- apiGroups: ["dapr.io"]
  resources: ["components"]
  verbs: ["create", "get", "list", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chatbot-dapr-manager
  namespace: default-insurance-chat
subjects:
- kind: ServiceAccount
  name: chatbot-sa
  namespace: default-insurance-chat
roleRef:
  kind: Role
  name: dapr-component-manager
  apiGroup: rbac.authorization.k8s.io
